services:
  kafka-volume-init:
    image: busybox   ## Use a lightweight image to initialize the volume
    command: chown -R 1000:1000 /tmp/kafka-logs # Change ownership to the user that Kafka runs as
    volumes:
      - kafka-data:/tmp/kafka-logs

  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    depends_on:
      kafka-volume-init:
        condition: service_completed_successfully
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: EXTERNAL://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s
    volumes:
      - kafka-data:/tmp/kafka-logs

  analytics-consumer:
    build:
      context: .
      dockerfile: consumers/Dockerfile
    container_name: analytics-consumer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: mouse-events
      KAFKA_CONSUMER_GROUP: analytics-consumer
      KAFKA_AUTO_OFFSET_RESET: earliest
      PYTHONUNBUFFERED: 1
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  kafka-data: