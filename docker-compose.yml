services:
  kafka-volume-init:
    image: busybox   ## Use a lightweight image to initialize the volume
    command: chown -R 1000:1000 /tmp/kafka-logs # Change ownership to the user that Kafka runs as
    volumes:
      - kafka-data:/tmp/kafka-logs

  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    depends_on:
      kafka-volume-init:
        condition: service_completed_successfully
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: EXTERNAL://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false" 
      #KAFKA_CLUSTER_ID: 4L62YDgVSOeNm1SI8gBI0A
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s
    volumes:
      - kafka-data:/tmp/kafka-logs

#### Topic Initialization Service  
  kafka-init:
    image: apache/kafka:4.3.1
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        echo "Creating Kafka topics..."

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 \
          --create \
          --if-not-exists \
          --topic mouse-events \
          --partitions 3 \
          --replication-factor 1

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 \
          --create \
          --if-not-exists \
          --topic mouse-events-aggregated \
          --partitions 3 \
          --replication-factor 1

        echo "Topics ready:"

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 \
          --list
  
  
################################ Consumers ##############################  
  
  analytics-consumer:
    build:
      context: .
      dockerfile: consumers/Dockerfile
    #container_name: analytics-consumer
    command: ["python","-u", "-m",  "consumers.analytics_consumer"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: mouse-events
      KAFKA_CONSUMER_GROUP: analytics-consumer
      KAFKA_AGGREGATE_TOPIC: mouse-events-aggregated
      KAFKA_AUTO_OFFSET_RESET: earliest
      WINDOW_SECONDS: 10
      HEATMAP_GRID_SIZE: 50
      PYTHONUNBUFFERED: 1
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully



  aggregate-writer-consumer:
    build:
      context: .
      dockerfile: consumers/Dockerfile
    container_name: aggregate-writer-consumer
    command: ["python", "-u", "-m", "consumers.aggregate_writer"]
    restart: on-failure
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_AGGREGATE_TOPIC: mouse-events-aggregated
      KAFKA_CONSUMER_GROUP: aggregate-writer
      KAFKA_AUTO_OFFSET_RESET: earliest
      DB_HOST: db
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      PYTHONUNBUFFERED: 1
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy

####################################### Kafka UI Service ##############################

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8081:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy



############################## PostgreSQL and pgAdmin Services ##############################
  db:
    image: postgres:18
    container_name: ${DB_NAME}
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432" 
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_gui    
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin






volumes:
  kafka-data:
  postgres_data:
  pgadmin_data:
