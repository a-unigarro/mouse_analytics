services:

  kafka-volume-init:
    image: busybox
    command: chown -R 1000:1000 /tmp/kafka-logs
    volumes:
      - kafka-data:/tmp/kafka-logs

  kafka:
    image: apache/kafka:4.3.1
    depends_on:
      kafka-volume-init:
        condition: service_completed_successfully
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

    volumes:
      - kafka-data:/tmp/kafka-logs

    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s

    restart: unless-stopped


  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy

    command:
      - /bin/sh
      - -c
      - |
        echo "Creating Kafka topics..."

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 \
          --create \
          --if-not-exists \
          --topic mouse-events \
          --partitions 3 \
          --replication-factor 1

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 \
          --create \
          --if-not-exists \
          --topic mouse-events-aggregated \
          --partitions 3 \
          --replication-factor 1

        echo "Topics ready:" 

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 \
          --list


  api:
    image: apunigarro/mouse-analytics-backend:${IMAGE_TAG}
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000"]


    ports:
      - "8000:8000"

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      HEATMAP_GRID_SIZE: 50

      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      PYTHONUNBUFFERED: 1

    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy

    restart: unless-stopped


  analytics-consumer:
    image: apunigarro/mouse-analytics-consumers:${IMAGE_TAG}

    command:  ["python","-u", "-m",  "consumers.analytics_consumer"]

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: mouse-events
      KAFKA_CONSUMER_GROUP: analytics-consumer
      KAFKA_AGGREGATE_TOPIC: mouse-events-aggregated
      KAFKA_AUTO_OFFSET_RESET: earliest
      WINDOW_SECONDS: 10
      HEATMAP_GRID_SIZE: 50
      PYTHONUNBUFFERED: 1

    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

    restart: unless-stopped


  aggregate-writer-consumer:
    image: apunigarro/mouse-analytics-consumers:${IMAGE_TAG}

    command:  ["python","-u", "-m",  "consumers.aggregate_writer"]


    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_AGGREGATE_TOPIC: mouse-events-aggregated
      KAFKA_CONSUMER_GROUP: aggregate-writer
      KAFKA_AUTO_OFFSET_RESET: earliest

      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      PYTHONUNBUFFERED: 1

    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy

    restart: unless-stopped


  db:
    image: postgres:18

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 5

    restart: unless-stopped


volumes:
  kafka-data:
  postgres_data: