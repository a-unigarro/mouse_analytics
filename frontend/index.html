<!DOCTYPE html>

<html>

<head>
    <title>
        Mouse Tracker
    </title>
</head>


<body>

<h1>
Mouse Tracker
</h1>

<p id="position">
</p>


<script>

const socket = new WebSocket(
    "ws://localhost:8000/mouse"
);

const sessionId = crypto.randomUUID();

const MAX_EVENTS_PER_SECOND = 5;
const MIN_INTERVAL = 1000 / MAX_EVENTS_PER_SECOND;

let lastSentTime = 0;

socket.onopen = () => {
    console.log(
        "Connected"
    );
};


document.addEventListener(
    "mousemove",
    (event) => {

        const now = Date.now();

        // Throttle mouse events
        if (now - lastSentTime < MIN_INTERVAL) {
            return;
        }

        lastSentTime = now;

        const data = {
            session_id: sessionId,
            event_type: "mousemove",
            user_id: "anonymous",
            timestamp: new Date().toISOString(),
            x: event.clientX,
            y: event.clientY
        };


        document.getElementById(
            "position"
        ).innerText =
        `x:${data.x} y:${data.y}`;


        if (socket.readyState === WebSocket.OPEN) {
            socket.send(
                JSON.stringify(data)
            );
            }
    }
);


socket.onclose = () => {
    console.log(
        "Disconnected"
    );
};

socket.onerror = (error) => {
    console.error("WebSocket error:", error);
};


</script>

</body>

</html>
