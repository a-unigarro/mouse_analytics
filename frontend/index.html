<!DOCTYPE html>
<html>

<head>
    <title>Mouse Analytics</title>
    <style>
        body {
            margin: 0;
            font-family: system-ui, sans-serif;
            background: #14161a;
            color: #eee;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            border-bottom: 1px solid #2a2d33;
        }

        h1 {
            font-size: 18px;
            margin: 0;
        }

        #position {
            font-size: 13px;
            color: #888;
        }

        .controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        button {
            background: #2a2d33;
            color: #eee;
            border: 1px solid #3a3d44;
            border-radius: 6px;
            padding: 8px 14px;
            cursor: pointer;
            font-size: 13px;
        }

        button.active {
            background: #4a7cff;
            border-color: #4a7cff;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            padding: 24px;
            width: 900px;
            margin: 0 auto;
        }

        .tile {
            position: relative;
            aspect-ratio: 1;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            cursor: pointer;
            user-select: none;
            transition: transform 0.08s ease;
        }

        .tile:active {
            transform: scale(0.96);
        }

        .tile .badge {
            position: absolute;
            top: 6px;
            right: 6px;
            min-width: 20px;
            padding: 2px 6px;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.55);
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            display: none;
        }

        .tile .badge.visible {
            display: block;
        }

        #heatmap-canvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>

<body>

    <header>
        <h1>Mouse Analytics</h1>
        <div class="controls">
            <span id="position"></span>
            <button id="toggle-click-heatmap">Click heatmap</button>
            <button id="toggle-move-heatmap">Movement heatmap</button>
            <button id="toggle-element-counts">Tile clicks</button>
        </div>
    </header>

    <div class="grid" id="tile-grid"></div>

    <canvas id="heatmap-canvas"></canvas>

    <script>
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";

        const socket = new WebSocket(
            `${protocol}//${window.location.host}/mouse`
        );

        const API_BASE = `${window.location.protocol}//${window.location.host}/api`;

        const sessionId = crypto.randomUUID();

        const MAX_EVENTS_PER_SECOND = 5;
        const MIN_INTERVAL = 1000 / MAX_EVENTS_PER_SECOND;
        let lastSentTime = 0;

        socket.onopen = () => console.log("Connected");
        socket.onclose = () => console.log("Disconnected");
        socket.onerror = (error) => console.error("WebSocket error:", error);

        function sendEvent(eventType, x, y, element) {
            const data = {
                session_id: sessionId,
                event_type: eventType,
                user_id: "anonymous",
                timestamp: new Date().toISOString(),
                x: x,
                y: y,
                page: "gallery",
                element: element || null
            };

            if (socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify(data));
            }
        }

        // --- Mousemove tracking (unchanged behavior, throttled) ---
        document.addEventListener("mousemove", (event) => {
            const now = Date.now();
            if (now - lastSentTime < MIN_INTERVAL) return;
            lastSentTime = now;

            document.getElementById("position").innerText =
                `x:${event.pageX} y:${event.pageY}`;

            sendEvent("mousemove", event.pageX, event.pageY, null);
        });

        // --- Tile grid: meaningful click targets instead of blank space ---
        const TILES = [
            { id: "tile-cat", emoji: "\u{1F431}", color: "#3b5bdb" },
            { id: "tile-rocket", emoji: "\u{1F680}", color: "#e8590c" },
            { id: "tile-globe", emoji: "\u{1F30D}", color: "#2f9e44" },
            { id: "tile-book", emoji: "\u{1F4DA}", color: "#9c36b5" },
            { id: "tile-coffee", emoji: "\u2615", color: "#795548" },
            { id: "tile-star", emoji: "\u2B50", color: "#f08c00" },
            { id: "tile-music", emoji: "\u{1F3B5}", color: "#1098ad" },
            { id: "tile-camera", emoji: "\u{1F4F7}", color: "#495057" },
            { id: "tile-plant", emoji: "\u{1F331}", color: "#37b24d" },
        ];

        const grid = document.getElementById("tile-grid");
        const tileBadges = {}; // tile.id -> badge <span> element

        TILES.forEach((tile) => {
            const el = document.createElement("div");
            el.className = "tile";
            el.style.background = tile.color;
            el.dataset.element = tile.id;
            el.textContent = tile.emoji;

            const badge = document.createElement("span");
            badge.className = "badge";
            badge.textContent = "0";
            el.appendChild(badge);
            tileBadges[tile.id] = badge;

            el.addEventListener("click", (event) => {
                sendEvent("click", event.pageX, event.pageY, tile.id);
            });

            grid.appendChild(el);
        });

        // --- Heatmap overlay (spatial: grid_x/grid_y) ---
        const canvas = document.getElementById("heatmap-canvas");
        const ctx = canvas.getContext("2d");

        function resizeCanvas() {
            // Full document size, not just the visible viewport — the canvas
            // needs to cover everything that can be scrolled to, since it's
            // now positioned in normal document flow (not fixed to the
            // viewport) so it scrolls together with the tiles beneath it.
            canvas.width = document.documentElement.scrollWidth;
            canvas.height = document.documentElement.scrollHeight;
        }
        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();

        let activeHeatmap = null; // "click" | "mousemove" | null
        let pollTimer = null;

        async function fetchAndDrawHeatmap(eventType) {
            try {
                const res = await fetch(`${API_BASE}/heatmap?event_type=${eventType}`);
                if (!res.ok) return;
                const data = await res.json();
                drawHeatmap(data);
            } catch (err) {
                console.error("Failed to load heatmap:", err);
            }
        }

        function drawHeatmap(data) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (!data.cells.length) return;

            const gridSize = data.grid_size;
            const maxCount = Math.max(...data.cells.map((c) => c.count));

            data.cells.forEach((cell) => {
                const intensity = cell.count / maxCount; // 0..1
                ctx.fillStyle = `rgba(255, 70, 70, ${0.15 + intensity * 0.55})`;
                ctx.fillRect(
                    cell.grid_x * gridSize,
                    cell.grid_y * gridSize,
                    gridSize,
                    gridSize
                );
            });
        }

        function setActiveHeatmap(eventType) {
            const clickBtn = document.getElementById("toggle-click-heatmap");
            const moveBtn = document.getElementById("toggle-move-heatmap");

            if (activeHeatmap === eventType) {
                // Toggle off
                activeHeatmap = null;
                clickBtn.classList.remove("active");
                moveBtn.classList.remove("active");
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                if (pollTimer) clearInterval(pollTimer);
                return;
            }

            activeHeatmap = eventType;
            clickBtn.classList.toggle("active", eventType === "click");
            moveBtn.classList.toggle("active", eventType === "mousemove");

            if (pollTimer) clearInterval(pollTimer);
            fetchAndDrawHeatmap(eventType);
            pollTimer = setInterval(() => fetchAndDrawHeatmap(eventType), 3000);
        }

        document.getElementById("toggle-click-heatmap")
            .addEventListener("click", () => setActiveHeatmap("click"));

        document.getElementById("toggle-move-heatmap")
            .addEventListener("click", () => setActiveHeatmap("mousemove"));

        // --- Per-tile click-count badges (element-based, not spatial) ---
        let elementCountsActive = false;
        let elementPollTimer = null;

        async function fetchAndShowElementCounts() {
            try {
                const res = await fetch(`${API_BASE}/elements?event_type=click`);
                if (!res.ok) return;
                const data = await res.json();

                // Reset all badges to 0 first, so tiles with no clicks show 0
                // rather than a stale value from a previous poll.
                Object.values(tileBadges).forEach((badge) => {
                    badge.textContent = "0";
                });

                data.elements.forEach((entry) => {
                    const badge = tileBadges[entry.element];
                    if (badge) badge.textContent = entry.count;
                });
            } catch (err) {
                console.error("Failed to load element counts:", err);
            }
        }

        function toggleElementCounts() {
            const btn = document.getElementById("toggle-element-counts");
            elementCountsActive = !elementCountsActive;
            btn.classList.toggle("active", elementCountsActive);

            Object.values(tileBadges).forEach((badge) => {
                badge.classList.toggle("visible", elementCountsActive);
            });

            if (elementCountsActive) {
                fetchAndShowElementCounts();
                elementPollTimer = setInterval(fetchAndShowElementCounts, 3000);
            } else if (elementPollTimer) {
                clearInterval(elementPollTimer);
            }
        }

        document.getElementById("toggle-element-counts")
            .addEventListener("click", toggleElementCounts);
    </script>

</body>

</html>
